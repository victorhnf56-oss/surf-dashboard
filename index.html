<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Surf Desk</title>
<style>
:root{--ac:#2dc4f0;--mut:#7f93a6;--pn:#0c131a;--ln:#1c2a36}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:"Helvetica Neue",-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:1.6vmin}
header{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:baseline;align-items:baseline;padding:0 1vmin .6vmin}
#clock{font-size:6vmin;font-weight:300}
#date{font-size:3vmin;color:var(--mut);margin-left:2.5vmin;text-transform:capitalize}
#place{font-size:2.2vmin;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
#grid{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:row;flex-direction:row;min-height:0}
.rc{-webkit-flex:1.25;flex:1.25;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0}
.r{display:-webkit-flex;display:flex;min-height:0}
.rt{-webkit-flex:1.6;flex:1.6}.rb{-webkit-flex:1;flex:1}
.card{background:var(--pn);border-radius:.8vmin;margin:.5vmin;padding:2vmin 2.2vmin;-webkit-flex:1;flex:1;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
.hd{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:baseline;align-items:baseline}
h2{font-size:1.85vmin;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.wt{font-size:2.8vmin;font-weight:700;color:#fff}
.wt span{font-size:1.8vmin;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin-right:.8vmin}
.big{font-size:12vmin;font-weight:700;line-height:1.05;color:#fff;letter-spacing:-.02em}
.big small{font-size:4vmin;font-weight:600;color:var(--mut);margin-left:.8vmin;letter-spacing:0}
.sub{font-size:3.4vmin;color:#cfd9e2;margin-top:.4vmin;font-weight:600}
.arrow{display:inline-block;color:var(--ac)}
.gauge{height:.9vmin;background:var(--ln);border-radius:1vmin;margin-top:1.2vmin}
.gauge i{display:block;height:100%;background:var(--ac);border-radius:1vmin;width:0}
.fs{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;margin-top:1vmin;border-top:1px solid var(--ln);padding-top:1vmin}
.fd{-webkit-flex:1;flex:1;text-align:center;border-left:1px solid var(--ln);padding:.4vmin 0}
.fd:first-child{border-left:0}
.fd i{display:block;font-style:normal;font-size:2.1vmin;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.fd b{display:block;font-size:3.6vmin;color:#fff;font-weight:700;line-height:1.2}
.fd span{font-size:2.3vmin;color:var(--mut);font-weight:600}
.fd.nx{background:#142230}
.fd.nx b{color:var(--ac)}
svg.ic{width:9vmin;height:9vmin;margin:0;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;color:#e8eef4}
.wx{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.wx .big{font-size:8vmin;margin-left:1.5vmin}
.slot{-webkit-flex:1;flex:1;text-align:center;font-size:2.1vmin;color:var(--mut);font-weight:600}
.slot b{display:block;color:#fff;font-weight:700;font-size:2.4vmin}
.slot svg.ic{width:5.2vmin;height:5.2vmin;stroke-width:3.6;display:block;margin:0 auto}
.two{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;min-height:0}
.col{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between;padding-right:1.5vmin}
.col+.col{border-left:1px solid var(--ln);padding-left:2.5vmin;padding-right:0}
.col .big{font-size:9vmin}
.col .sub{font-size:2.8vmin}
.strip{display:-webkit-flex;display:flex;margin-top:.6vmin}
#tideSvg{color:var(--ac);width:100%;height:9vmin;margin-top:.8vmin}
.card.map{padding:0;overflow:hidden;position:relative;display:block;-webkit-flex:1;flex:1;background:#051f33}
.mapw{-webkit-flex:1.05;flex:1.05;position:relative;min-width:0}
#mapSvg{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;display:block}
.card.map .two{-webkit-flex:1.7;flex:1.7;padding:2vmin 2.4vmin}
.fd{min-width:0}
.tf .fd b{font-size:3.6vmin;letter-spacing:-.02em}
h2,.wt{white-space:nowrap}
footer{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;font-size:1.5vmin;color:#3a4a58;padding:0 2vmin}
.up{color:var(--ac)}.down{color:#f5a623}
</style>
</head>
<body>
<div id="app">
<div id="grid">
 <div class="card map"><svg id="mapSvg" viewBox="0 -56 129 188" preserveAspectRatio="xMidYMid meet"><g id="gBase"></g><g id="gDyn"></g></svg></div>
 <div class="rc">
  <div class="r rt">
  <div class="card"><div class="hd"><h2>Belle-Île</h2><div class="wt" id="b0W">–</div></div>
   <div><div class="big" id="b0H">–<small>m</small></div><div class="sub" id="b0S">–</div><div class="gauge"><i id="b0G"></i></div></div>
   <div class="fs" id="b0F"></div></div>
  <div class="card"><div class="hd"><h2>Noirmoutier</h2><div class="wt" id="b1W">–</div></div>
   <div><div class="big" id="b1H">–<small>m</small></div><div class="sub" id="b1S">–</div><div class="gauge"><i id="b1G"></i></div></div>
   <div class="fs" id="b1F"></div></div>

  </div>
  <div class="r rb">
  <div class="card"><div class="hd"><h2>Marée · Pornichet</h2><div class="wt" id="coef"></div></div>
   <div class="sub" id="tideNow">–</div>
   <svg id="tideSvg" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
   <div class="fs tf" id="tideF"></div></div>
  </div>
 </div>
</div>
<footer><span id="credit">Marées : api-maree.fr (CC BY), calculées à partir de composantes harmoniques Ifremer / PREVIMER (CC BY) · Imagerie : Esri, Maxar, Earthstar Geographics</span><span id="status">Chargement…</span></footer>
</div>
<script>
// ---- RÉGLAGES ----
var BUOYS=[{name:'Belle-Île',lat:47.30,lon:-3.40},{name:'Noirmoutier',lat:47.00,lon:-2.45}]; // points approximatifs
var LAND={lat:47.25,lon:-2.25};    // vent + météo (modèles Météo-France)
var WIND_UNIT='kn';                // 'kn' = nœuds, 'kmh' = km/h
var TIDE_KEY='d7c5dde6e8b5c6d0e2371b296acb8825'; // clé gratuite api-maree.fr
var TIDE_SITE='pornichet';         // identifiant du port
var REFRESH_MIN=15;
// ------------------
var TZ='Europe/Paris';
function $(id){return document.getElementById(id);}
function p2(n){return (n<10?'0':'')+n;}
function get(url,cb,err){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status===200){try{cb(JSON.parse(x.responseText));}catch(e){err(e);}}else err(x.status);};x.send();}
var DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
function dir(d){return d==null?'–':DIRS[Math.round(d/22.5)%16];}
function r1(v){return v==null?'–':(Math.round(v*10)/10).toFixed(1).replace('.',',');}
function hm(s){return s.substr(11,5);}
var CL='<path d="M20 46h24a10 10 0 0 0 0-20 14 14 0 0 0-27 3 9 9 0 0 0 3 17z"/>';
var SUN='<circle cx="32" cy="32" r="10"/><path d="M32 10v6M32 48v6M10 32h6M48 32h6M16 16l4 4M44 44l4 4M48 16l-4 4M20 44l-4 4"/>';
var MOON='<path d="M42 12A20 20 0 1 0 52 40 16 16 0 0 1 42 12z"/>';
function iconB(code,day){
 var b,sky=day?'<circle cx="22" cy="22" r="7"/><path d="M22 8v4M8 22h4M12 12l3 3M32 12l-3 3"/>':'<path d="M26 10A11 11 0 1 0 32 28 9 9 0 0 1 26 10z"/>';
 if(code===0||code===1)b=day?SUN:MOON;
 else if(code===2)b=sky+'<g transform="translate(8,8) scale(.8)" fill="#000">'+CL+'</g>';
 else if(code===3)b=CL;
 else if(code===45||code===48)b='<path d="M14 24h36M10 34h44M16 44h32"/>';
 else if(code>=71&&code<=77||code===85||code===86)b='<g transform="translate(0,-6)">'+CL+'</g><path d="M24 50v.1M34 54v.1M44 50v.1" stroke-width="6"/>';
 else if(code>=95)b='<g transform="translate(0,-6)">'+CL+'</g><path d="M35 44l-7 9h9l-5 9"/>';
 else b='<g transform="translate(0,-6)">'+CL+'</g><path d="M24 46l-3 9M34 46l-3 9M44 46l-3 9"/>';
 return b;
}
function icon(code,day){return '<svg class="ic" viewBox="0 0 64 64">'+iconB(code,day)+'</svg>';}
function arrow(deg){var r=(deg||0)+180;return '<span class="arrow" style="-webkit-transform:rotate('+r+'deg);transform:rotate('+r+'deg)">↑</span>';}
function spark(svg,vals,now){var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1,n=vals.length,pts=[],i;for(i=0;i<n;i++)pts.push((i/(n-1)*400).toFixed(1)+','+(90-(vals[i]-mn)/rg*80).toFixed(1));var nx=now/(n-1)*400;svg.innerHTML='<polygon points="0,100 '+pts.join(' ')+' 400,100" fill="currentColor" fill-opacity=".16"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="'+nx+'" y1="0" x2="'+nx+'" y2="100" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/>';}
function nowIdx(t){var d=new Date(),k=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':00',i;for(i=0;i<t.length;i++)if(t[i]>=k)return i;return 0;}

// ---- Houle (prévision modèle aux points des bouées) ----
var JRC=['dim','lun','mar','mer','jeu','ven','sam'];
function days3(h){
 var days=[],mx={},pr={},i,t,dd;
 for(i=0;i<h.time.length;i++){dd=h.time[i].substr(0,10);if(!mx.hasOwnProperty(dd)){mx[dd]=-1;pr[dd]=null;days.push(dd);}
  if(h.swell_wave_height[i]!=null&&h.swell_wave_height[i]>mx[dd]){mx[dd]=h.swell_wave_height[i];pr[dd]=h.swell_wave_period[i];}}
 var out='',n;
 for(n=1;n<=3&&n<days.length;n++){dd=days[n];t=new Date(+dd.substr(0,4),+dd.substr(5,2)-1,+dd.substr(8,2));
  out+='<div class="fd"><i>'+JRC[t.getDay()]+'</i><b>'+(mx[dd]<0?'–':r1(mx[dd]))+' m</b><span>'+(pr[dd]==null?'–':Math.round(pr[dd]))+' s</span></div>';}
 return out;
}
function loadSea(){
 get('https://marine-api.open-meteo.com/v1/marine?latitude='+BUOYS[0].lat+','+BUOYS[1].lat+'&longitude='+BUOYS[0].lon+','+BUOYS[1].lon+
  '&current=swell_wave_height,swell_wave_period,swell_wave_direction,sea_surface_temperature'+
  '&hourly=swell_wave_height,swell_wave_period&timezone='+TZ+'&forecast_days=4',function(r){
  var k;
  for(k=0;k<2;k++){
   var d=r[k],c=d.current;
   $('b'+k+'H').innerHTML=r1(c.swell_wave_height)+'<small>m</small>';
   MAPD.sw[k]={h:c.swell_wave_height,p:c.swell_wave_period,d:c.swell_wave_direction,t:c.sea_surface_temperature};
   $('b'+k+'G').style.width=Math.min(100,Math.round((c.swell_wave_height||0)/3*100))+'%';
   $('b'+k+'S').innerHTML=Math.round(c.swell_wave_period||0)+' s · '+dir(c.swell_wave_direction)+' '+arrow(c.swell_wave_direction);
   $('b'+k+'W').innerHTML='<span>Eau</span>'+r1(c.sea_surface_temperature)+'°C';
   $('b'+k+'F').innerHTML=days3(d.hourly);
  }
  drawMap();done();
 },fail);
}

// ---- Marée (api-maree.fr, port de Pornichet) ----
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function tideMsg(m){$('tideNow').textContent=m;$('tideF').innerHTML='';$('tideSvg').innerHTML='';$('coef').innerHTML='';}
function loadTide(){
 if(!TIDE_KEY){tideMsg('Clé api-maree.fr à renseigner');return;}
 var go=function(site){
  var q='site='+encodeURIComponent(site)+'&tz=Europe/Paris&key='+encodeURIComponent(TIDE_KEY),t=ymd(new Date()),n=new Date(),nm=p2(n.getHours())+':'+p2(n.getMinutes());
  get('https://api-maree.fr/tide-extrema?'+q+'&from='+t+'&to='+t,function(d){
   var ex=d.data[0].extrema,i,h='',cf=[],hit=false;
   for(i=0;i<ex.length;i++){var e=ex[i],nx=(!hit&&e.time>=nm);if(nx)hit=true;if(e.coef)cf.push(e.coef);
    h+='<div class="fd'+(nx?' nx':'')+'"><i>'+(e.type==='PM'?'Pleine':'Basse')+'</i><b>'+e.time.replace(':','h')+'</b><span>'+r1(e.height)+' m</span></div>';}
   $('tideF').innerHTML=h;$('coef').innerHTML=cf.length?'<span>Coef</span>'+cf.join(' · '):'';
  },function(){tideMsg('Marée indisponible');});
  get('https://api-maree.fr/water-levels?'+q+'&from='+t+'T00:00&to='+t+'T23:59&step=30',function(d){
   var v=[],i;for(i=0;i<d.data.length;i++)v.push(d.data[i].height);
   var f=(n.getHours()*60+n.getMinutes())/30,i0=Math.min(Math.floor(f),v.length-2);
   spark($('tideSvg'),v,f);
   $('tideNow').innerHTML=(v[i0+1]>v[i0]?'<span class="up">▲ Montante</span>':'<span class="down">▼ Descendante</span>')+' · '+r1(v[i0])+' m';
  },function(){tideMsg('Marée indisponible');});
 };
 if(TIDE_SITE){go(TIDE_SITE);return;}
 get('https://api-maree.fr/sites?key='+encodeURIComponent(TIDE_KEY),function(d){
  var i,s=d.sites||[];for(i=0;i<s.length;i++)if(/pornichet/i.test(s[i].site_name+s[i].site_id)){go(s[i].site_id);return;}
  tideMsg('Pornichet introuvable dans api-maree.fr');
 },function(){tideMsg('Marée indisponible');});
}

// ---- Vent + météo (Météo-France via Open-Meteo) ----
function loadWx(){
 get('https://api.open-meteo.com/v1/forecast?latitude='+LAND.lat+'&longitude='+LAND.lon+'&models=meteofrance_seamless'+
  '&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m'+
  '&hourly=weather_code,temperature_2m,is_day&daily=sunrise,sunset&wind_speed_unit='+WIND_UNIT+'&timezone='+TZ+'&forecast_days=2',function(d){
  var c=d.current,u=WIND_UNIT==='kn'?'nd':'km/h';
  var hh=d.hourly,i0=nowIdx(hh.time),fc=[],k;
  for(k=3;k<=12;k+=3){var q=i0+k;if(hh.time[q])fc.push({c:hh.weather_code[q],day:hh.is_day[q]===1,t:hh.temperature_2m[q],h:hh.time[q].substr(11,2)});}
  MAPD.wx={c:c.weather_code,day:c.is_day===1,t:c.temperature_2m,f:c.apparent_temperature,sr:hm(d.daily.sunrise[0]),ss:hm(d.daily.sunset[0]),fc:fc};
  MAPD.wind={s:c.wind_speed_10m,d:c.wind_direction_10m,g:c.wind_gusts_10m};drawMap();done();
 },fail);
}

// ---- Carte ----
var MAINLAND=[[-4.5,47.9],[-3.6,47.78],[-3.45,47.73],[-3.35,47.71],[-3.25,47.67],[-3.14,47.60],[-3.12,47.56],[-3.15,47.50],[-3.13,47.47],[-3.08,47.50],[-3.07,47.55],[-2.92,47.55],[-2.78,47.50],[-2.57,47.52],[-2.47,47.47],[-2.47,47.40],[-2.55,47.38],[-2.52,47.29],[-2.42,47.27],[-2.34,47.26],[-2.21,47.27],[-2.17,47.26],[-2.23,47.13],[-2.10,47.11],[-2.03,47.05],[-1.98,46.99],[-1.95,46.95],[-2.0,46.90],[-2.07,46.82],[-2.03,46.76],[-1.94,46.69],[-1.8,46.6],[-1.4,46.5],[-1.4,48.6],[-4.5,48.6]];
var YEU=[[-2.43,46.73],[-2.33,46.75],[-2.28,46.72],[-2.35,46.69],[-2.45,46.71]];
var BELLE=[[-3.30,47.34],[-3.22,47.38],[-3.12,47.37],[-3.07,47.33],[-3.10,47.29],[-3.22,47.30]];
var NOIR=[[-2.30,47.03],[-2.20,47.02],[-2.13,46.98],[-2.15,46.90],[-2.22,46.92],[-2.30,46.98]];
var TS=256*1024,KM=9.6;
function mxp(lon){return (lon+180)/360*TS;}
function myp(lat){var r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*TS;}
var OX=mxp(-3.6),OY=myp(47.8);
function xy(o){return [(mxp(o[0])-OX)/KM,(myp(o[1])-OY)/KM];}
function poly(a){var i,r=[];for(i=0;i<a.length;i++){var q=xy(a[i]);r.push(q[0].toFixed(1)+','+q[1].toFixed(1));}return '<polygon points="'+r.join(' ')+'" fill="#111c27" stroke="#2b4156" stroke-width="0.8" stroke-linejoin="round"/>';}
function pin(lon,lat,col,label,dx,dy,anchor){var q=xy([lon,lat]);return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.2" fill="'+col+'"/><text x="'+(q[0]+dx).toFixed(1)+'" y="'+(q[1]+dy).toFixed(1)+'" font-size="6.5" fill="'+col+'" stroke="#00121f" stroke-opacity=".6" stroke-width="1.3" paint-order="stroke" stroke-linejoin="round" text-anchor="'+anchor+'" font-family="Helvetica,Arial,sans-serif">'+label+'</text>';}
var MAPD={sw:[null,null],wind:null};
function waves(cx,cy,w){
 if(!w||w.h==null||w.d==null)return '';
 var b=((w.d+180)%360)*Math.PI/180,ux=Math.sin(b),uy=-Math.cos(b),tx=-uy,ty=ux;
 var sp=3+(w.p||8)*0.6,sw=0.5+Math.min(w.h,3.5)*0.9,op=(0.3+Math.min(w.h/3,1)*0.6).toFixed(2),out='',k,s,o,pts;
 for(k=-2;k<=2;k++){pts=[];
  for(s=-13;s<=13;s+=1.5){o=k*sp+0.9*Math.sin(s*0.8);pts.push((cx+tx*s+ux*o).toFixed(1)+','+(cy+ty*s+uy*o).toFixed(1));}
  out+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#ffffff" stroke-width="'+sw.toFixed(1)+'" stroke-opacity="'+op+'" stroke-linecap="round" stroke-linejoin="round"/>';}
 return out;
}
function tx(x,y,t,sz,col,an,wt){return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="'+sz+'" fill="'+col+'" stroke="#00121f" stroke-opacity=".6" stroke-width="1.3" paint-order="stroke" stroke-linejoin="round" text-anchor="'+(an||'start')+'" font-weight="'+(wt||700)+'" font-family="Helvetica,Arial,sans-serif">'+t+'</text>';}
function ico(code,day,x,y,z){return '<svg x="'+x+'" y="'+y+'" width="'+z+'" height="'+z+'" viewBox="0 0 64 64" fill="none" stroke="#e8eef4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'+iconB(code,day)+'</svg>';}
function overlay(){
 var o='',w=MAPD.wx,v=MAPD.wind,i,f,cx;
 if(w){
  o+=ico(w.c,w.day,6,-53,22)+tx(33,-35,Math.round(w.t)+'°',20,'#fff')+tx(6,-24,'Ressenti '+Math.round(w.f)+'° · '+w.sr+'–'+w.ss,5.5,'#9fb0c0','start',600);
  for(i=0;i<w.fc.length;i++){f=w.fc[i];cx=17+i*32;o+=ico(f.c,f.day,cx-6,-19,12)+tx(cx,-2,Math.round(f.t)+'° '+f.h+'h',5.8,'#fff','middle');}
 }
 if(v){
  var kt=WIND_UNIT==='kn'?v.s:v.s/1.852,sc=(0.8+Math.min(kt/25,1)*0.5).toFixed(2),rot=((v.d||0)+180)%360,u=WIND_UNIT==='kn'?'nd':'km/h';
  o+='<g transform="translate(85,-41) rotate('+rot+') scale('+sc+')"><path d="M0 9V-9M-5 -4L0 -9L5 -4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>'+
   tx(96,-36,Math.round(v.s)+' '+u,13,'#fff')+tx(123,-24,dir(v.d)+' · raf. '+Math.round(v.g),5.5,'#9fb0c0','end',600);
 }
 return o;
}
function buoyPin(i,name,below){
 var b=BUOYS[i],q=xy([b.lon,b.lat]),w=MAPD.sw[i],x=q[0],y=q[1],an=below?'start':'end',dx=below?(4-x):-7,y0=below?y+11:y-2;
 var o='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" fill="#2dc4f0" stroke="#ffffff" stroke-width="1"/>'+tx(x+dx,y0,name,6.5,'#2dc4f0',an);
 if(w&&w.h!=null)o+=tx(x+dx,y0+8.5,r1(w.h)+' m · '+Math.round(w.p)+' s',8.5,'#fff',an)+tx(x+dx,y0+15,'eau '+r1(w.t)+'°C',5.8,'#9fb0c0',an,600);
 return o;
}
function pts(a){var i,r=[];for(i=0;i<a.length;i++){var q=xy(a[i]);r.push(q[0].toFixed(1)+','+q[1].toFixed(1));}return r.join(' ');}
function fitMap(){var e=$('mapSvg'),w=e.clientWidth,h=e.clientHeight;if(w&&h){var vh=129*h/w;e.setAttribute('viewBox','0 -56 129 '+vh.toFixed(1));return vh;}return 188;}
function drawBase(){
 var vh=fitMap(),L=[MAINLAND,BELLE,NOIR,YEU],i,j,p,land='',halo='',coast='',t='';
 for(i=0;i<L.length;i++){p=pts(L[i]);
  land+='<polygon points="'+p+'"/>';
  halo+='<polygon points="'+p+'" fill="#45c9bb" stroke="#45c9bb" stroke-width="6" stroke-linejoin="round"/>';
  coast+='<polygon points="'+p+'" fill="none" stroke="#efe6c4" stroke-opacity=".5" stroke-width=".5" stroke-linejoin="round"/>';}
 var h='<defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b4160"/><stop offset="1" stop-color="#051f33"/></linearGradient>'+
  '<filter id="bl" filterUnits="userSpaceOnUse" x="-80" y="-130" width="300" height="420"><feGaussianBlur stdDeviation="3.4"/></filter>'+
  '<filter id="tex" filterUnits="userSpaceOnUse" x="-80" y="-130" width="300" height="420"><feTurbulence type="fractalNoise" baseFrequency=".06 .08" numOctaves="4" seed="11" result="n"/>'+
  '<feColorMatrix in="n" type="matrix" values=".34 0 0 0 .07  0 .30 0 0 .20  0 0 .14 0 .08  0 0 0 0 1" result="c"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter></defs>';
 h+='<rect x="-80" y="-130" width="300" height="420" fill="url(#sea)"/><g filter="url(#bl)" opacity=".8">'+halo+'</g><g filter="url(#tex)">'+land+'</g>'+coast;
 var x0=Math.floor(OX/256),x1=Math.floor((OX+129*KM)/256),y0=Math.floor((OY-56*KM)/256),y1=Math.floor((OY+(vh-56)*KM)/256),u,z=(256/KM+0.3).toFixed(2);
 for(i=x0;i<=x1;i++)for(j=y0;j<=y1;j++){
  u='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/10/'+j+'/'+i;
  t+='<image x="'+((i*256-OX)/KM).toFixed(2)+'" y="'+((j*256-OY)/KM).toFixed(2)+'" width="'+z+'" height="'+z+'" preserveAspectRatio="none" href="'+u+'" xlink:href="'+u+'"/>';}
 h+=t+'<rect x="-80" y="-130" width="300" height="420" fill="#000" fill-opacity=".14"/>';
 $('gBase').innerHTML=h;
}
function drawMap(){
 var a=xy([BUOYS[0].lon,BUOYS[0].lat]),b=xy([BUOYS[1].lon,BUOYS[1].lat]),q=xy([-2.21,47.27]),L=[MAINLAND,BELLE,NOIR,YEU],i,m='';
 for(i=0;i<L.length;i++)m+='<polygon points="'+pts(L[i])+'"/>';
 var h='<defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".62"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>'+
  '<mask id="sm" maskUnits="userSpaceOnUse" x="-80" y="-130" width="300" height="420"><rect x="-80" y="-130" width="300" height="420" fill="#fff"/><g fill="#000">'+m+'</g></mask></defs>';
 h+='<g mask="url(#sm)">'+waves(a[0],a[1],MAPD.sw[0])+waves(b[0],b[1],MAPD.sw[1])+'</g><rect x="-80" y="-56" width="300" height="74" fill="url(#shade)"/>'+overlay();
 h+=buoyPin(0,'Belle-Île',true)+buoyPin(1,'Noirmoutier',false);
 h+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="5.5" fill="none" stroke="#f5a623" stroke-width="1.4"/><circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.4" fill="#f5a623"/>'+tx(q[0]-8,q[1]-5,'Saint-Nazaire',6.5,'#f5a623','end');
 $('gDyn').innerHTML=h;
}

function done(){var d=new Date();$('status').textContent='Mis à jour '+p2(d.getHours())+':'+p2(d.getMinutes())+' · houle : modèle aux points des bouées';}
function fail(){$('status').textContent='Données indisponibles, nouvel essai dans quelques minutes…';}
function load(){loadSea();loadWx();loadTide();}
drawBase();drawMap();window.addEventListener('resize',function(){drawBase();drawMap();});load();setInterval(load,REFRESH_MIN*60000);
</script>
