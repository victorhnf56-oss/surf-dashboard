<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Surf Desk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f1ecfa;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:2vmin}
header{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:baseline;align-items:baseline;padding:0 1vmin .6vmin}
#clock{font-size:6vmin;font-weight:200}
#date{font-size:3vmin;color:#c4b8e0;margin-left:2.5vmin;text-transform:capitalize}
#place{font-size:2.4vmin;color:#a78bfa;text-transform:uppercase;letter-spacing:.15em}
#grid{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:0}
.r{display:-webkit-flex;display:flex;min-height:0}
.rt{-webkit-flex:1.6;flex:1.6}.rb{-webkit-flex:1;flex:1}
.card{--c:#60a5fa;background:#000;border:1px solid #241a3d;border-radius:2vmin;margin:.7vmin;padding:2vmin;-webkit-flex:1;flex:1;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
.hd{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:baseline;align-items:baseline}
h2{font-size:2.2vmin;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.14em}
.wt{font-size:3.4vmin;font-weight:600;color:var(--c)}
.wt span{font-size:1.9vmin;font-weight:400;color:#8b82a8;text-transform:uppercase;letter-spacing:.12em;margin-right:.8vmin}
.big{font-size:12vmin;font-weight:600;line-height:1.05;color:var(--c)}
.big small{font-size:4vmin;font-weight:400;color:#8b82a8;margin-left:.8vmin}
.sub{font-size:3.4vmin;color:#c4b8e0;margin-top:.4vmin}
.row{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;font-size:2.4vmin;color:#8b82a8}
.row b{color:#f1ecfa;font-weight:600}
.arrow{display:inline-block}
.fs{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;margin-top:1vmin}
.fd{-webkit-flex:1;flex:1;text-align:center;border-left:1px solid #241a3d;padding:.4vmin 0}
.fd:first-child{border-left:0}
.fd i{display:block;font-style:normal;font-size:2.3vmin;color:#8b82a8;text-transform:uppercase;letter-spacing:.1em}
.fd b{display:block;font-size:4.4vmin;color:var(--c);font-weight:600;line-height:1.2}
.fd span{font-size:2.4vmin;color:#a99fc6}
.fd.nx{background:#120c22;border-radius:1vmin}
.fd.nx b{color:#fff}
svg.ic{width:9vmin;height:9vmin;margin:0;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;color:var(--c)}
.wx{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.wx .big{font-size:8vmin;margin-left:1.5vmin}
.slot{-webkit-flex:1;flex:1;text-align:center;font-size:2.1vmin;color:#8b82a8}
.slot b{display:block;color:#f1ecfa;font-weight:600;font-size:2.4vmin}
.slot svg.ic{width:5.2vmin;height:5.2vmin;stroke-width:3.6;display:block;margin:0 auto}
.two{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;min-height:0}
.col{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between;padding-right:1.5vmin}
.col+.col{border-left:1px solid #241a3d;padding-left:2.5vmin;padding-right:0}
.col .big{font-size:9vmin}
.col .sub{font-size:2.8vmin}
.strip{display:-webkit-flex;display:flex;margin-top:.6vmin}
#tideSvg{color:var(--c);width:100%;height:9vmin;margin-top:.8vmin}
#mapSvg{-webkit-flex:1;flex:1;min-height:0;height:100%;margin-top:1vmin}
footer{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;font-size:1.5vmin;color:#4a4163;padding:0 2vmin}
.up{color:#60a5fa}.down{color:#f472b6}
</style>
</head>
<body>
<div id="app">
<header><div><span id="clock">--:--</span><span id="date"></span></div><div id="place">Surf Desk · Saint-Nazaire</div></header>
<div id="grid">
 <div class="r rt">
  <div class="card" style="--c:#60a5fa"><div class="hd"><h2>Bouée Belle-Île</h2><div class="wt" id="b0W">–</div></div>
   <div><div class="big" id="b0H">–<small>m</small></div><div class="sub" id="b0S">–</div></div>
   <div class="fs" id="b0F"></div></div>
  <div class="card" style="--c:#818cf8"><div class="hd"><h2>Bouée Noirmoutier</h2><div class="wt" id="b1W">–</div></div>
   <div><div class="big" id="b1H">–<small>m</small></div><div class="sub" id="b1S">–</div></div>
   <div class="fs" id="b1F"></div></div>
  <div class="card" style="--c:#a78bfa"><div class="hd"><h2>Marée · Pornichet</h2><div class="wt" id="coef"></div></div>
   <div class="sub" id="tideNow">–</div>
   <svg id="tideSvg" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
   <div class="fs" id="tideF"></div></div>
 </div>
 <div class="r rb">
  <div class="card" style="-webkit-flex:2;flex:2"><div class="two">
   <div class="col" style="--c:#c084fc"><h2>Vent</h2><div class="big" id="wd">–<small>nd</small></div><div class="sub" id="wdS">–</div></div>
   <div class="col" style="--c:#e879f9"><h2>Météo</h2><div class="wx"><div id="icon"></div><div class="big" id="tmp">–<small>°C</small></div></div><div class="strip" id="strip"></div><div class="sub" id="feel">–</div></div>
  </div></div>
  <div class="card" style="--c:#f472b6"><h2>Côte</h2><svg id="mapSvg" viewBox="0 0 129 105" preserveAspectRatio="xMidYMid meet"></svg></div>
 </div>
</div>
<footer><span id="credit">Marées : api-maree.fr (CC BY), calculées à partir de composantes harmoniques Ifremer / PREVIMER (CC BY)</span><span id="status">Chargement…</span></footer>
</div>
<script>
// ---- RÉGLAGES ----
var BUOYS=[{name:'Belle-Île',lat:47.30,lon:-3.40},{name:'Noirmoutier',lat:47.01,lon:-2.29}]; // points approximatifs
var LAND={lat:47.25,lon:-2.25};    // vent + météo (modèles Météo-France)
var WIND_UNIT='kn';                // 'kn' = nœuds, 'kmh' = km/h
var TIDE_KEY='';                   // clé gratuite api-maree.fr (voir explications)
var TIDE_SITE='';                  // laisser vide : cherche « Pornichet » automatiquement
var REFRESH_MIN=15;
// ------------------
var TZ='Europe/Paris';
function $(id){return document.getElementById(id);}
function p2(n){return (n<10?'0':'')+n;}
function get(url,cb,err){var x=new XMLHttpRequest();x.open('GET',url,true);x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status===200){try{cb(JSON.parse(x.responseText));}catch(e){err(e);}}else err(x.status);};x.send();}
var DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
function dir(d){return d==null?'–':DIRS[Math.round(d/22.5)%16];}
function r1(v){return v==null?'–':(Math.round(v*10)/10).toFixed(1).replace('.',',');}
function hm(s){return s.substr(11,5);}
var CL='<path d="M20 46h24a10 10 0 0 0 0-20 14 14 0 0 0-27 3 9 9 0 0 0 3 17z"/>';
var SUN='<circle cx="32" cy="32" r="10"/><path d="M32 10v6M32 48v6M10 32h6M48 32h6M16 16l4 4M44 44l4 4M48 16l-4 4M20 44l-4 4"/>';
var MOON='<path d="M42 12A20 20 0 1 0 52 40 16 16 0 0 1 42 12z"/>';
function icon(code,day){
 var b,sky=day?'<circle cx="22" cy="22" r="7"/><path d="M22 8v4M8 22h4M12 12l3 3M32 12l-3 3"/>':'<path d="M26 10A11 11 0 1 0 32 28 9 9 0 0 1 26 10z"/>';
 if(code===0||code===1)b=day?SUN:MOON;
 else if(code===2)b=sky+'<g transform="translate(8,8) scale(.8)" fill="#000">'+CL+'</g>';
 else if(code===3)b=CL;
 else if(code===45||code===48)b='<path d="M14 24h36M10 34h44M16 44h32"/>';
 else if(code>=71&&code<=77||code===85||code===86)b='<g transform="translate(0,-6)">'+CL+'</g><path d="M24 50v.1M34 54v.1M44 50v.1" stroke-width="6"/>';
 else if(code>=95)b='<g transform="translate(0,-6)">'+CL+'</g><path d="M35 44l-7 9h9l-5 9"/>';
 else b='<g transform="translate(0,-6)">'+CL+'</g><path d="M24 46l-3 9M34 46l-3 9M44 46l-3 9"/>';
 return '<svg class="ic" viewBox="0 0 64 64">'+b+'</svg>';
}
function arrow(deg){var r=(deg||0)+180;return '<span class="arrow" style="-webkit-transform:rotate('+r+'deg);transform:rotate('+r+'deg)">↑</span>';}
function spark(svg,vals,now){var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1,n=vals.length,pts=[],i;for(i=0;i<n;i++)pts.push((i/(n-1)*400).toFixed(1)+','+(90-(vals[i]-mn)/rg*80).toFixed(1));var nx=now/(n-1)*400;svg.innerHTML='<polyline points="'+pts.join(' ')+'" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="'+nx+'" y1="0" x2="'+nx+'" y2="100" stroke="#e9d5ff" stroke-width="2" vector-effect="non-scaling-stroke"/>';}
function nowIdx(t){var d=new Date(),k=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':00',i;for(i=0;i<t.length;i++)if(t[i]>=k)return i;return 0;}

// ---- Houle (prévision modèle aux points des bouées) ----
var JRC=['dim','lun','mar','mer','jeu','ven','sam'];
function days3(h){
 var days=[],mx={},pr={},i,t,dd;
 for(i=0;i<h.time.length;i++){dd=h.time[i].substr(0,10);if(!mx.hasOwnProperty(dd)){mx[dd]=-1;pr[dd]=null;days.push(dd);}
  if(h.swell_wave_height[i]!=null&&h.swell_wave_height[i]>mx[dd]){mx[dd]=h.swell_wave_height[i];pr[dd]=h.swell_wave_period[i];}}
 var out='',n;
 for(n=1;n<=3&&n<days.length;n++){dd=days[n];t=new Date(+dd.substr(0,4),+dd.substr(5,2)-1,+dd.substr(8,2));
  out+='<div class="fd"><i>'+JRC[t.getDay()]+'</i><b>'+(mx[dd]<0?'–':r1(mx[dd]))+' m</b><span>'+(pr[dd]==null?'–':Math.round(pr[dd]))+' s</span></div>';}
 return out;
}
function loadSea(){
 get('https://marine-api.open-meteo.com/v1/marine?latitude='+BUOYS[0].lat+','+BUOYS[1].lat+'&longitude='+BUOYS[0].lon+','+BUOYS[1].lon+
  '&current=swell_wave_height,swell_wave_period,swell_wave_direction,sea_surface_temperature'+
  '&hourly=swell_wave_height,swell_wave_period&timezone='+TZ+'&forecast_days=4',function(r){
  var k;
  for(k=0;k<2;k++){
   var d=r[k],c=d.current;
   $('b'+k+'H').innerHTML=r1(c.swell_wave_height)+'<small>m</small>';
   $('b'+k+'S').innerHTML=Math.round(c.swell_wave_period||0)+' s · '+dir(c.swell_wave_direction)+' '+arrow(c.swell_wave_direction);
   $('b'+k+'W').innerHTML='<span>Eau</span>'+r1(c.sea_surface_temperature)+'°C';
   $('b'+k+'F').innerHTML=days3(d.hourly);
  }
  done();
 },fail);
}

// ---- Marée (api-maree.fr, port de Pornichet) ----
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function tideMsg(m){$('tideNow').textContent=m;$('tideF').innerHTML='';$('tideSvg').innerHTML='';$('coef').innerHTML='';}
function loadTide(){
 if(!TIDE_KEY){tideMsg('Clé api-maree.fr à renseigner');return;}
 var go=function(site){
  var q='site='+encodeURIComponent(site)+'&tz=Europe/Paris&key='+encodeURIComponent(TIDE_KEY),t=ymd(new Date()),n=new Date(),nm=p2(n.getHours())+':'+p2(n.getMinutes());
  get('https://api-maree.fr/tide-extrema?'+q+'&from='+t+'&to='+t,function(d){
   var ex=d.data[0].extrema,i,h='',cf=[],hit=false;
   for(i=0;i<ex.length;i++){var e=ex[i],nx=(!hit&&e.time>=nm);if(nx)hit=true;if(e.coef)cf.push(e.coef);
    h+='<div class="fd'+(nx?' nx':'')+'"><i>'+(e.type==='PM'?'Pleine':'Basse')+'</i><b>'+e.time.replace(':','h')+'</b><span>'+r1(e.height)+' m</span></div>';}
   $('tideF').innerHTML=h;$('coef').innerHTML=cf.length?'<span>Coef</span>'+cf.join(' · '):'';
  },function(){tideMsg('Marée indisponible');});
  get('https://api-maree.fr/water-levels?'+q+'&from='+t+'T00:00&to='+t+'T23:59&step=30',function(d){
   var v=[],i;for(i=0;i<d.data.length;i++)v.push(d.data[i].height);
   var f=(n.getHours()*60+n.getMinutes())/30,i0=Math.min(Math.floor(f),v.length-2);
   spark($('tideSvg'),v,f);
   $('tideNow').innerHTML=(v[i0+1]>v[i0]?'<span class="up">▲ Montante</span>':'<span class="down">▼ Descendante</span>')+' · '+r1(v[i0])+' m';
  },function(){tideMsg('Marée indisponible');});
 };
 if(TIDE_SITE){go(TIDE_SITE);return;}
 get('https://api-maree.fr/sites?key='+encodeURIComponent(TIDE_KEY),function(d){
  var i,s=d.sites||[];for(i=0;i<s.length;i++)if(/pornichet/i.test(s[i].site_name+s[i].site_id)){go(s[i].site_id);return;}
  tideMsg('Pornichet introuvable dans api-maree.fr');
 },function(){tideMsg('Marée indisponible');});
}

// ---- Vent + météo (Météo-France via Open-Meteo) ----
function loadWx(){
 get('https://api.open-meteo.com/v1/forecast?latitude='+LAND.lat+'&longitude='+LAND.lon+'&models=meteofrance_seamless'+
  '&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m'+
  '&hourly=weather_code,temperature_2m,is_day&daily=sunrise,sunset&wind_speed_unit='+WIND_UNIT+'&timezone='+TZ+'&forecast_days=2',function(d){
  var c=d.current,u=WIND_UNIT==='kn'?'nd':'km/h';
  $('wd').innerHTML=Math.round(c.wind_speed_10m)+'<small>'+u+'</small>';
  $('wdS').innerHTML=dir(c.wind_direction_10m)+' '+arrow(c.wind_direction_10m)+' · raf. '+Math.round(c.wind_gusts_10m);
  $('tmp').innerHTML=Math.round(c.temperature_2m)+'<small>°C</small>';
  $('icon').innerHTML=icon(c.weather_code,c.is_day===1);
  $('feel').textContent='Ressenti '+Math.round(c.apparent_temperature)+'° · '+hm(d.daily.sunrise[0])+'–'+hm(d.daily.sunset[0]);
  var hh=d.hourly,i0=nowIdx(hh.time),st='',k;
  for(k=3;k<=9;k+=3){var q=i0+k;if(hh.time[q])st+='<div class="slot">'+icon(hh.weather_code[q],hh.is_day[q]===1)+'<b>'+Math.round(hh.temperature_2m[q])+'°</b>'+hh.time[q].substr(11,2)+'h</div>';}
  $('strip').innerHTML=st;done();
 },fail);
}

// ---- Carte ----
var MAINLAND=[[-3.6,47.78],[-3.45,47.73],[-3.35,47.71],[-3.25,47.67],[-3.14,47.60],[-3.12,47.56],[-3.15,47.50],[-3.13,47.47],[-3.08,47.50],[-3.07,47.55],[-2.92,47.55],[-2.78,47.50],[-2.57,47.52],[-2.47,47.47],[-2.47,47.40],[-2.55,47.38],[-2.52,47.29],[-2.42,47.27],[-2.34,47.26],[-2.21,47.27],[-2.17,47.26],[-2.23,47.13],[-2.10,47.11],[-2.03,47.05],[-1.98,46.99],[-1.95,46.95],[-1.9,46.85],[-1.9,47.8],[-3.6,47.8]];
var BELLE=[[-3.30,47.34],[-3.22,47.38],[-3.12,47.37],[-3.07,47.33],[-3.10,47.29],[-3.22,47.30]];
var NOIR=[[-2.30,47.03],[-2.20,47.02],[-2.13,46.98],[-2.15,46.90],[-2.22,46.92],[-2.30,46.98]];
function xy(o){return [(o[0]+3.6)*75.9,(47.8-o[1])*111];}
function poly(a){var i,r=[];for(i=0;i<a.length;i++){var q=xy(a[i]);r.push(q[0].toFixed(1)+','+q[1].toFixed(1));}return '<polygon points="'+r.join(' ')+'" fill="#1b1432" stroke="#3b2a66" stroke-width="0.8" stroke-linejoin="round"/>';}
function pin(lon,lat,col,label,dx,dy,anchor){var q=xy([lon,lat]);return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.2" fill="'+col+'"/><text x="'+(q[0]+dx).toFixed(1)+'" y="'+(q[1]+dy).toFixed(1)+'" font-size="6.5" fill="'+col+'" text-anchor="'+anchor+'" font-family="Helvetica,Arial,sans-serif">'+label+'</text>';}
function drawMap(){
 var h=poly(MAINLAND)+poly(BELLE)+poly(NOIR);
 h+=pin(BUOYS[0].lon,BUOYS[0].lat,'#60a5fa','Belle-Île',0,-6,'middle');
 h+=pin(BUOYS[1].lon,BUOYS[1].lat,'#818cf8','Noirmoutier',-6,3,'end');
 var q=xy([-2.21,47.27]);
 h+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="5.5" fill="none" stroke="#f472b6" stroke-width="1.4"/><circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.4" fill="#f472b6"/><text x="'+(q[0]-8).toFixed(1)+'" y="'+(q[1]-6).toFixed(1)+'" font-size="6.5" fill="#f472b6" text-anchor="end" font-family="Helvetica,Arial,sans-serif">Saint-Nazaire</text>';
 $('mapSvg').innerHTML=h;
}

function done(){var d=new Date();$('status').textContent='Mis à jour '+p2(d.getHours())+':'+p2(d.getMinutes())+' · houle : modèle aux points des bouées';}
function fail(){$('status').textContent='Données indisponibles, nouvel essai dans quelques minutes…';}
var JRS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function tick(){var d=new Date();$('clock').textContent=p2(d.getHours())+':'+p2(d.getMinutes());$('date').textContent=JRS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];}
function load(){loadSea();loadWx();loadTide();}
drawMap();tick();setInterval(tick,10000);load();setInterval(load,REFRESH_MIN*60000);
</script>
</body>
</html>
