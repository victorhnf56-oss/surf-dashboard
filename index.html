<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Surf · Saint-Nazaire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05090f;color:#e8f1f8;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:2vmin}
header{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:baseline;align-items:baseline;padding:0 1vmin 1.5vmin}
#clock{font-size:7vmin;font-weight:200;letter-spacing:.02em}
#place{font-size:2.6vmin;color:#7f95a8;text-transform:uppercase;letter-spacing:.15em}
#grid{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;min-height:0}
.card{background:#0e1722;border-radius:2vmin;margin:1vmin;padding:2.4vmin;-webkit-flex:1 1 30%;flex:1 1 30%;min-width:28%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:space-between;justify-content:space-between}
.card.wide{-webkit-flex:1 1 46%;flex:1 1 46%}
h2{font-size:2.1vmin;font-weight:600;color:#6aa9d4;text-transform:uppercase;letter-spacing:.14em;margin-bottom:1vmin}
.big{font-size:10vmin;font-weight:600;line-height:1}
.big small{font-size:3.6vmin;font-weight:400;color:#9fb3c4;margin-left:.6vmin}
.sub{font-size:2.8vmin;color:#a9bccb;margin-top:1vmin;line-height:1.3}
.row{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;font-size:2.8vmin;margin-top:.8vmin;color:#a9bccb}
.row b{color:#e8f1f8;font-weight:600}
.arrow{display:inline-block;-webkit-transition:-webkit-transform 1s;transition:transform 1s}
svg{width:100%;height:11vmin;margin-top:1vmin}
#status{font-size:1.9vmin;color:#4f6272;text-align:right;padding:0 2vmin}
.up{color:#5fd39a}.down{color:#f0a860}
</style>
</head>
<body>
<div id="app">
<header><div id="clock">--:--</div><div id="place">Saint-Nazaire · Côte d'Amour</div></header>
<div id="grid">
 <div class="card"><h2>Houle</h2><div><div class="big" id="swH">–<small>m</small></div>
  <div class="sub" id="swS">–</div></div>
  <div class="row"><span>Mer totale</span><b id="wvH">–</b></div></div>
 <div class="card"><h2>Vent</h2><div><div class="big" id="wd">–<small>km/h</small></div>
  <div class="sub" id="wdS">–</div></div>
  <div class="row"><span>Rafales</span><b id="gust">–</b></div></div>
 <div class="card"><h2>Eau</h2><div><div class="big" id="sst">–<small>°C</small></div>
  <div class="sub" id="air">–</div></div>
  <div class="row"><span>Soleil</span><b id="sun">–</b></div></div>
 <div class="card wide"><h2>Marée</h2>
  <div class="sub" id="tideNow">–</div>
  <svg id="tideSvg" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
  <div class="row"><span>Prochaine pleine mer</span><b id="hi">–</b></div>
  <div class="row"><span>Prochaine basse mer</span><b id="lo">–</b></div></div>
 <div class="card wide"><h2>Houle · 24 h</h2>
  <div class="sub" id="swNext">–</div>
  <svg id="swSvg" viewBox="0 0 400 100" preserveAspectRatio="none"></svg>
  <div class="row"><span>Vent · 24 h (km/h)</span><b id="wdMax">–</b></div></div>
</div>
<div id="status">Chargement…</div>
</div>
<script>
// ---- RÉGLAGES : modifie ici pour changer de spot ----
var LAND = {lat: 47.25, lon: -2.25};   // météo / vent
var SEA  = {lat: 47.10, lon: -2.40};   // point en mer (houle, marée, eau)
var REFRESH_MIN = 15;
// -----------------------------------------------------
var TZ = 'Europe/Paris';
function $(id){return document.getElementById(id);}
function p2(n){return (n<10?'0':'')+n;}
function get(url, cb, err){
  var x=new XMLHttpRequest();x.open('GET',url,true);
  x.onreadystatechange=function(){if(x.readyState!==4)return;
    if(x.status===200){try{cb(JSON.parse(x.responseText));}catch(e){err(e);}}else err(x.status);};
  x.send();
}
var DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
function dir(d){return d==null?'–':DIRS[Math.round(d/22.5)%16];}
function r1(v){return v==null?'–':(Math.round(v*10)/10).toFixed(1).replace('.',',');}
function hm(s){return s.substr(11,5);}
var WMO={0:'Ciel dégagé',1:'Peu nuageux',2:'Partiellement nuageux',3:'Couvert',45:'Brouillard',48:'Brouillard givrant',51:'Bruine',53:'Bruine',55:'Bruine',61:'Pluie faible',63:'Pluie',65:'Forte pluie',71:'Neige',80:'Averses',81:'Averses',82:'Fortes averses',95:'Orage',96:'Orage',99:'Orage'};
function arrow(deg){return '<span class="arrow" style="-webkit-transform:rotate('+(deg+180)+'deg);transform:rotate('+(deg+180)+'deg)">↑</span>';}

function spark(svg, vals, now){
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1,n=vals.length,pts=[],i;
  for(i=0;i<n;i++)pts.push((i/(n-1)*400).toFixed(1)+','+(90-(vals[i]-mn)/rg*80).toFixed(1));
  var nx=now/(n-1)*400;
  svg.innerHTML='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#4aa3df" stroke-width="3" vector-effect="non-scaling-stroke"/>'+
   '<line x1="'+nx+'" y1="0" x2="'+nx+'" y2="100" stroke="#f0a860" stroke-width="2" vector-effect="non-scaling-stroke"/>';
}
function nowIdx(times){
  var d=new Date(),k=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':00',i;
  for(i=0;i<times.length;i++)if(times[i]>=k)return i;return 0;
}

function loadSea(){
  get('https://marine-api.open-meteo.com/v1/marine?latitude='+SEA.lat+'&longitude='+SEA.lon+
   '&current=wave_height,swell_wave_height,swell_wave_period,swell_wave_direction,sea_surface_temperature'+
   '&hourly=swell_wave_height,sea_level_height_msl&timezone='+TZ+'&forecast_days=3', function(d){
    var c=d.current,h=d.hourly;
    $('swH').innerHTML=r1(c.swell_wave_height)+'<small>m</small>';
    $('swS').innerHTML=Math.round(c.swell_wave_period||0)+' s · '+dir(c.swell_wave_direction)+' '+arrow(c.swell_wave_direction||0);
    $('wvH').textContent=r1(c.wave_height)+' m';
    $('sst').innerHTML=r1(c.sea_surface_temperature)+'<small>°C</small>';
    var i0=nowIdx(h.time),t=h.time.slice(i0,i0+24),lv=h.sea_level_height_msl.slice(i0,i0+24),sw=h.swell_wave_height.slice(i0,i0+24);
    spark($('swSvg'),sw,0);
    var mxS=Math.max.apply(null,sw);
    $('swNext').textContent='Max prévu : '+r1(mxS)+' m';
    spark($('tideSvg'),lv,0);
    var rising=lv[1]>lv[0];
    $('tideNow').innerHTML=(rising?'<span class="up">▲ Montante</span>':'<span class="down">▼ Descendante</span>')+' · '+r1(lv[0])+' m';
    var hi=null,lo=null,i;
    var L=h.sea_level_height_msl,T=h.time;
    for(i=i0+1;i<L.length-1;i++){
      if(!hi&&L[i]>=L[i-1]&&L[i]>L[i+1])hi=T[i]+' ('+r1(L[i])+' m)';
      if(!lo&&L[i]<=L[i-1]&&L[i]<L[i+1])lo=T[i]+' ('+r1(L[i])+' m)';
    }
    $('hi').textContent=hi?hi.substr(11):'–';
    $('lo').textContent=lo?lo.substr(11):'–';
    done();
  }, fail);
}
function loadWx(){
  get('https://api.open-meteo.com/v1/forecast?latitude='+LAND.lat+'&longitude='+LAND.lon+
   '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m'+
   '&hourly=wind_speed_10m&daily=sunrise,sunset&wind_speed_unit=kmh&timezone='+TZ+'&forecast_days=2', function(d){
    var c=d.current;
    $('wd').innerHTML=Math.round(c.wind_speed_10m)+'<small>km/h</small>';
    $('wdS').innerHTML=dir(c.wind_direction_10m)+' '+arrow(c.wind_direction_10m||0);
    $('gust').textContent=Math.round(c.wind_gusts_10m)+' km/h';
    $('air').textContent='Air '+Math.round(c.temperature_2m)+'° · '+(WMO[c.weather_code]||'');
    $('sun').textContent=hm(d.daily.sunrise[0])+' → '+hm(d.daily.sunset[0]);
    var i0=nowIdx(d.hourly.time),w=d.hourly.wind_speed_10m.slice(i0,i0+24);
    $('wdMax').textContent='max '+Math.round(Math.max.apply(null,w));
    done();
  }, fail);
}
var ok=0;
function done(){ok++;var d=new Date();$('status').textContent='Mis à jour '+p2(d.getHours())+':'+p2(d.getMinutes())+' · Open-Meteo';}
function fail(){$('status').textContent='Données indisponibles, nouvel essai dans quelques minutes…';}
function load(){loadSea();loadWx();}
function tick(){var d=new Date();$('clock').textContent=p2(d.getHours())+':'+p2(d.getMinutes());}
tick();setInterval(tick,10000);
load();setInterval(load,REFRESH_MIN*60000);
</script>
</body>
</html>
